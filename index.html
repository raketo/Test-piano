<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      background: white;
      overflow: hidden;
      font-family: sans-serif;
    }
    canvas {
      display: block;
    }
    .controls {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 10;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #22c55e;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #16a34a;
    }
    #trackSelector {
      padding: 10px 15px;
      font-size: 16px;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #trackSelector:hover {
      background-color: #2563eb;
    }
    .track-label {
      font-size: 14px;
      color: #333;
      font-weight: bold;
    }
    #speedSelector {
      padding: 10px 15px;
      font-size: 16px;
      background-color: #8b5cf6;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #speedSelector:hover {
      background-color: #7c3aed;
    }
    .speed-label {
      font-size: 14px;
      color: #333;
      font-weight: bold;
    }
    </style>
</head>
<body>
<div class="controls">
  <span class="track-label">Track:</span>
  <select id="trackSelector">
    <option value="">Loading tracks...</option>
  </select>
  <span class="speed-label" style="margin-left: 20px;">Speed:</span>
  <select id="speedSelector">
    <option value="30">30%</option>
    <option value="35">35%</option>
    <option value="40">40%</option>
    <option value="45">45%</option>
    <option value="50">50%</option>
    <option value="55">55%</option>
    <option value="60">60%</option>
    <option value="65">65%</option>
    <option value="70">70%</option>
    <option value="75">75%</option>
    <option value="80">80%</option>
    <option value="85">85%</option>
    <option value="90">90%</option>
    <option value="95">95%</option>
    <option value="100" selected>100%</option>
    <option value="105">105%</option>
    <option value="110">110%</option>
    <option value="115">115%</option>
    <option value="120">120%</option>
  </select>
  <button id="resetBtn">Reset</button>
  <button id="pauseBtn">Pause</button>
</div>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const resetBtn = document.getElementById("resetBtn");
const pauseBtn = document.getElementById("pauseBtn");
const trackSelector = document.getElementById("trackSelector");
const speedSelector = document.getElementById("speedSelector");

// --- State ---
let speedMultiplier = 1.0;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// --- Track data ---
let allTracks = [];
let fingerColors = {};
let notes = [];

// Load tracks from JSON file
async function loadTracks() {
  try {
    const response = await fetch("tracks.json");
    const data = await response.json();
    fingerColors = data.fingers;
    allTracks = data.tracks;
    populateTrackSelector();
    if (allTracks.length > 0) {
      trackSelector.value = allTracks[0].id;
      selectTrack(allTracks[0].id);
    }
  } catch (error) {
    console.error("Error loading tracks:", error);
  }
}

// Helper function to get color from finger number
function getFingerColor(finger) {
  return fingerColors[finger]?.color || "#999";
}

function populateTrackSelector() {
  trackSelector.innerHTML = "";
  allTracks.forEach(track => {
    const option = document.createElement("option");
    option.value = track.id;
    option.textContent = track.name;
    trackSelector.appendChild(option);
  });
}

function selectTrack(trackId) {
  const selectedTrack = allTracks.find(t => t.id === trackId);
  if (selectedTrack) {
    notes = [...selectedTrack.notes];
    resetAnimation();
  }
}

trackSelector.addEventListener("change", (e) => {
  selectTrack(e.target.value);
});

speedSelector.addEventListener("change", (e) => {
  const oldSpeedMultiplier = speedMultiplier;
  speedMultiplier = parseInt(e.target.value) / 100;
  
  // Adjust startTime to maintain continuity when speed changes
  if (!isPaused) {
    const currentEffectiveTime = ((performance.now() - startTime) / 1000) * oldSpeedMultiplier;
    startTime = performance.now() - (currentEffectiveTime / speedMultiplier) * 1000;
  }
});

// --- Mapping ---
const pixelsPerSecond = 120;
const baseY = 200;

function pitchToY(pitch) {
  return baseY - (pitch - 60) * 6;
}

// --- Helper function to draw rounded rectangles ---
function roundedRect(x, y, w, h, radius) {
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.lineTo(x + w - radius, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
  ctx.lineTo(x + w, y + h - radius);
  ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
  ctx.lineTo(x + radius, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
  ctx.lineTo(x, y + radius);
  ctx.quadraticCurveTo(x, y, x + radius, y);
  ctx.closePath();
  ctx.fill();
}

// --- Timing ---
let startTime = performance.now();
let pausedTime = 0;
let isPaused = false;

function resetAnimation() {
  // Start 2 seconds before 0 to give player preparation time
  startTime = performance.now() - (2 / speedMultiplier) * 1000;
  pausedTime = 0;
  isPaused = false;
  pauseBtn.textContent = "Pause";
}

function togglePause() {
  if (isPaused) {
    startTime = performance.now() - (pausedTime / speedMultiplier) * 1000;
    isPaused = false;
    pauseBtn.textContent = "Pause";
  } else {
    pausedTime = ((performance.now() - startTime) / 1000) * speedMultiplier;
    isPaused = true;
    pauseBtn.textContent = "Resume";
  }
}

resetBtn.addEventListener("click", resetAnimation);
pauseBtn.addEventListener("click", togglePause);

// Tap on canvas to pause/resume
canvas.addEventListener("click", togglePause);

function draw() {
  let now;
  if (isPaused) {
    now = pausedTime;
  } else {
    const realTime = (performance.now() - startTime) / 1000;
    now = realTime * speedMultiplier;
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // --- Staff lines ---
  ctx.strokeStyle = "#000";
  for (let i = 0; i < 5; i++) {
    const y = baseY - i * 12;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }

  // --- Notes ---
  notes.forEach(note => {
    const x = canvas.width / 3 + (note.start - now) * pixelsPerSecond;
    const y = pitchToY(note.pitch);
    const w = note.duration * pixelsPerSecond;
    const h = 20;

    ctx.fillStyle = getFingerColor(note.finger);
    roundedRect(x, y, w, h, 6);

    ctx.fillStyle = "#000";
    ctx.font = "12px sans-serif";
    ctx.fillText(note.label, x + 5, y + 14);
  });

  // --- Playhead line ---
  ctx.strokeStyle = "lime";
  ctx.beginPath();
  ctx.moveTo(canvas.width / 3, 0);
  ctx.lineTo(canvas.width / 3, canvas.height);
  ctx.stroke();

  requestAnimationFrame(draw);
}

// Load tracks and start animation
loadTracks();
draw();
</script>
</body>
</html>
