<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      background: #f3f4f6;
      overflow: hidden;
      font-family: sans-serif;
    }
    canvas {
      display: block;
    }
    .controls {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 10;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #22c55e;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #16a34a;
    }
    #trackSelector {
      padding: 10px 15px;
      font-size: 16px;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #trackSelector:hover {
      background-color: #2563eb;
    }
    .track-label {
      font-size: 14px;
      color: #333;
      font-weight: bold;
    }
    .track-info {
      font-size: 14px;
      color: #333;
    }
    #speedSelector {
      padding: 10px 15px;
      font-size: 16px;
      background-color: #8b5cf6;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #speedSelector:hover {
      background-color: #7c3aed;
    }
    .speed-label {
      font-size: 14px;
      color: #333;
      font-weight: bold;
    }
    </style>
</head>
<body>
<div class="controls">
  <span class="track-label">Track:</span>
  <select id="trackSelector">
    <option value="">Loading tracks...</option>
  </select>
  <span id="trackInfo" class="track-info"></span>
  <span class="speed-label" style="margin-left: 20px;">Speed:</span>
  <select id="speedSelector">
    <option value="30">30%</option>
    <option value="35">35%</option>
    <option value="40">40%</option>
    <option value="45">45%</option>
    <option value="50">50%</option>
    <option value="55">55%</option>
    <option value="60">60%</option>
    <option value="65">65%</option>
    <option value="70">70%</option>
    <option value="75">75%</option>
    <option value="80">80%</option>
    <option value="85">85%</option>
    <option value="90">90%</option>
    <option value="95">95%</option>
    <option value="100" selected>100%</option>
    <option value="105">105%</option>
    <option value="110">110%</option>
    <option value="115">115%</option>
    <option value="120">120%</option>
  </select>
  <button id="resetBtn">Reset</button>
  <button id="pauseBtn">Pause</button>
</div>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const resetBtn = document.getElementById("resetBtn");
const pauseBtn = document.getElementById("pauseBtn");
const trackSelector = document.getElementById("trackSelector");
const trackInfo = document.getElementById("trackInfo");
const speedSelector = document.getElementById("speedSelector");

// --- State ---
let speedMultiplier = 1.0;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// --- Track data ---
let allTracks = [];
let fingerColors = {};
let notes = [];
let noteUnitSeconds = 0.5;
let selectedTimeSignature = { top: 4, bottom: 4 };

// Load tracks from JSON file
async function loadTracks() {
  try {
    const response = await fetch("tracks.json");
    const data = await response.json();
    fingerColors = data.fingers;
    allTracks = data.tracks;
    populateTrackSelector();
    if (allTracks.length > 0) {
      trackSelector.value = allTracks[0].id;
      selectTrack(allTracks[0].id);
    }
  } catch (error) {
    console.error("Error loading tracks:", error);
  }
}

// Helper function to get color from finger number
function getFingerColor(finger) {
  return fingerColors[finger]?.color || "#999";
}

function populateTrackSelector() {
  trackSelector.innerHTML = "";
  allTracks.forEach(track => {
    const option = document.createElement("option");
    option.value = track.id;
    option.textContent = track.name;
    trackSelector.appendChild(option);
  });
}

function selectTrack(trackId) {
  const selectedTrack = allTracks.find(t => t.id === trackId);
  if (selectedTrack) {
    const rightHandNotes = selectedTrack.rightHandNotes ?? selectedTrack.notes ?? [];
    const leftHandNotes = selectedTrack.leftHandNotes ?? [];
    notes = [
      ...rightHandNotes.map(note => ({ ...note, hand: "right" })),
      ...leftHandNotes.map(note => ({ ...note, hand: "left" }))
    ];
    const bpm = selectedTrack.bpm ?? 120;
    const timeSignature = selectedTrack.timeSignature ?? { top: 4, bottom: 4 };
    selectedTimeSignature = timeSignature;
    noteUnitSeconds = 60 / bpm * 4 / timeSignature.bottom;
    trackInfo.textContent = `${bpm} BPM (quarter note) · ${timeSignature.top}/${timeSignature.bottom}`;
    resetAnimation();
  }
}

trackSelector.addEventListener("change", (e) => {
  selectTrack(e.target.value);
});

speedSelector.addEventListener("change", (e) => {
  const oldSpeedMultiplier = speedMultiplier;
  speedMultiplier = parseInt(e.target.value) / 100;
  
  // Adjust startTime to maintain continuity when speed changes
  if (!isPaused) {
    const currentEffectiveTime = ((performance.now() - startTime) / 1000) * oldSpeedMultiplier;
    startTime = performance.now() - (currentEffectiveTime / speedMultiplier) * 1000;
  }
});

// --- Mapping ---
const visualScale = 1.25;
const pixelsPerSecond = 120 * visualScale;
const staffLineSpacing = 12 * visualScale;
const notePitchSpacing = 6 * visualScale;

function pitchToY(pitch, label, hand, staffBottomY) {
  const pitchClass = ((pitch % 12) + 12) % 12;
  const octave = Math.floor(pitch / 12) - 1;
  const sharpNoteLetters = ["C", "C", "D", "D", "E", "F", "F", "G", "G", "A", "A", "B"];
  const letter = /^[A-G]/i.exec(label)?.[0].toUpperCase() || sharpNoteLetters[pitchClass];
  const diatonicPosition = octave * 7 + "CDEFGAB".indexOf(letter);
  const bottomLinePitch = hand === "left" ? 43 : 64;
  const bottomLineLetter = hand === "left" ? "G" : "E";
  const bottomLineOctave = Math.floor(bottomLinePitch / 12) - 1;
  const bottomLinePosition = bottomLineOctave * 7 + "CDEFGAB".indexOf(bottomLineLetter);
  return staffBottomY - (diatonicPosition - bottomLinePosition) * notePitchSpacing;
}

// --- Helper function to draw rounded rectangles ---
function roundedRect(x, y, w, h, radius) {
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.lineTo(x + w - radius, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
  ctx.lineTo(x + w, y + h - radius);
  ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
  ctx.lineTo(x + radius, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
  ctx.lineTo(x, y + radius);
  ctx.quadraticCurveTo(x, y, x + radius, y);
  ctx.closePath();
  ctx.fill();
}

// --- Timing ---
let startTime = performance.now();
let pausedTime = 0;
let isPaused = false;

function resetAnimation() {
  // Begin the timeline 2 seconds before the track starts.
  startTime = performance.now() + (2 / speedMultiplier) * 1000;
  pausedTime = 0;
  isPaused = false;
  pauseBtn.textContent = "Pause";
}

function togglePause() {
  if (isPaused) {
    startTime = performance.now() - (pausedTime / speedMultiplier) * 1000;
    isPaused = false;
    pauseBtn.textContent = "Pause";
  } else {
    pausedTime = ((performance.now() - startTime) / 1000) * speedMultiplier;
    isPaused = true;
    pauseBtn.textContent = "Resume";
  }
}

resetBtn.addEventListener("click", resetAnimation);
pauseBtn.addEventListener("click", togglePause);

// Tap on canvas to pause/resume
canvas.addEventListener("click", togglePause);

function draw() {
  let now;
  if (isPaused) {
    now = pausedTime;
  } else {
    const realTime = (performance.now() - startTime) / 1000;
    now = realTime * speedMultiplier;
  }

  const upperStaffBottomY = canvas.height / 2 - 1.5 * staffLineSpacing;
  const lowerStaffBottomY = canvas.height / 2 + 5.5 * staffLineSpacing;
  const staffBottoms = [upperStaffBottomY, lowerStaffBottomY];

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#fff";
  staffBottoms.forEach(staffBottomY => {
    ctx.fillRect(0, staffBottomY - 4 * staffLineSpacing, canvas.width, 4 * staffLineSpacing);
  });

  // --- Staff lines ---
  ctx.strokeStyle = "#000";
  ctx.lineWidth = visualScale;
  staffBottoms.forEach(staffBottomY => {
    for (let i = 0; i < 5; i++) {
      const y = staffBottomY - i * staffLineSpacing;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(canvas.width, y);
      ctx.stroke();
    }
  });


  

  // --- Measure grid ---
  const measureLength = selectedTimeSignature.top;
  const currentBeat = now / noteUnitSeconds;
  const firstBeat = Math.floor((currentBeat - canvas.width / 3 / (pixelsPerSecond * noteUnitSeconds)) / measureLength) * measureLength;
  const lastBeat = currentBeat + (canvas.width - canvas.width / 3) / (pixelsPerSecond * noteUnitSeconds);
  const firstMeasure = Math.floor(firstBeat / measureLength);
  const lastMeasure = Math.ceil(lastBeat / measureLength);

  ctx.font = `${12 * visualScale}px sans-serif`;
  for (let measure = firstMeasure; measure <= lastMeasure; measure++) {
    const measureBeat = measure * measureLength;
    const measureX = canvas.width / 3 + (measureBeat * noteUnitSeconds - now) * pixelsPerSecond;

    ctx.strokeStyle = "#9ca3af";
    ctx.lineWidth = 2 * visualScale;
    ctx.beginPath();
    ctx.moveTo(measureX, 0);
    ctx.lineTo(measureX, canvas.height);
    ctx.stroke();

    if (measure >= 0) {
      ctx.fillStyle = "#4b5563";
      ctx.fillText(`Measure ${measure + 1}`, measureX + 4 * visualScale, upperStaffBottomY - 4 * staffLineSpacing - 5 * visualScale);
    }


  }

  // --- Notes ---
  notes.forEach(note => {
    const noteStart = note.start * noteUnitSeconds;
    const noteDuration = note.duration * noteUnitSeconds;
    const x = canvas.width / 3 + (noteStart - now) * pixelsPerSecond;
    const h = 10 * visualScale;
    const staffBottomY = note.hand === "left" ? lowerStaffBottomY : upperStaffBottomY;
    const y = pitchToY(note.pitch, note.label, note.hand, staffBottomY) - h / 2;
    const w = noteDuration * pixelsPerSecond;

    ctx.fillStyle = getFingerColor(note.finger);
    roundedRect(x, y, w, h, 3 * visualScale);

    ctx.fillStyle = "#fff";
    ctx.font = `${9 * visualScale}px sans-serif`;
    ctx.fillText(note.label, x + 5 * visualScale, y + h / 2 + 3 * visualScale);
  });

  // --- Playhead line ---
  ctx.strokeStyle = "lime";
  ctx.lineWidth = visualScale;
  ctx.beginPath();
  ctx.moveTo(canvas.width / 3, 0);
  ctx.lineTo(canvas.width / 3, canvas.height);
  ctx.stroke();

  requestAnimationFrame(draw);
}

// Load tracks and start animation
loadTracks();
draw();
</script>
</body>
</html>
